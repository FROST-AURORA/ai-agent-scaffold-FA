ai:
  agent:
    config:
      tables:
        drawIoAgent:
          app-name: drawIoAgent
          agent:
            agent-id: 300000
            agent-name: AI交互式绘图智能体
            agent-desc: 人 + AI + Draw.io，交互式对话完成 draw.io 绘图。
          module:
            ai-api:
              base-url: https://api.deepseek.com
              api-key: sk-ba6ebbebc47d4d02989f6685abf51bf2
              completions-path: /v1/chat/completions
              embeddings-path: /v1/embeddings
              request-timeout: 500000
            chat-model:
              model: deepseek-v4-flash
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: sse?api_key=Bearer+bce-v3/ALTAK-VNHFDDhxotqBJEQtPgDJv/2c043efe186253a2d6195cb95a1ec2be70857256
                    request-timeout: 500000
                - local:
                    name: myToolCallbackProvider
            agents:
              # 1. 需求分析与检索智能体
              - name: agent_analyst
                description: 负责理解用户意图，调用工具检索信息，并决定是请求补充信息还是继续绘图。
                instruction: |
                  你是一个专业的需求分析师。你的任务是分析用户的绘图请求。
                  1. 如果用户提供了具体的上下文或需要引用外部知识（如Git仓库、本地文件），请使用可用的工具（MCP）进行检索和分析。
                  2. 分析用户的意图：
                     - 如果用户的描述模糊、不完整，无法直接生成图表，你需要返回 JSON 格式要求用户补充信息。
                       格式：{"type": "user", "content": "请补充关于...的具体信息"}
                     - 如果用户意图清晰，请整理出详细的绘图需求（图表类型、节点、关系、布局要求等）。
                  3. 输出你的分析结果。
                output-key: analysis_result

              # 2. 绘图执行智能体
              - name: agent_drawer
                description: 根据分析结果生成 Draw.io 的 XML 数据。
                instruction: |
                  你是一个 Draw.io 绘图专家。请根据输入 {analysis_result} 进行操作：
                  1. 如果输入是 {"type": "user", ...}，请直接原样输出该 JSON。
                  2. 如果输入是详细的绘图需求：
                     - 设计图表的结构（UML、流程图、时序图等）。
                     - 生成符合 Draw.io 规范的 XML 代码。
                     - 确保节点布局合理，逻辑清晰，连线不能交叉等。
                     - 只输出原始 XML 内容，不要输出 Markdown、代码块或解释文字。
                output-key: draft_diagram

              # 3. 检查与优化智能体
              - name: agent_reviewer
                description: 检查并修复 Draw.io XML，确保 XML 可被 Draw.io 渲染。
                instruction: |
                  你是一个图表质量检查员。请审查输入 {draft_diagram}：
                  1. 如果输入是 {"type": "user", ...}，必须原样输出该 JSON，不要增加任何解释。
                  2. 如果输入包含 Draw.io XML，必须提取真正的 XML 内容，删除所有 Markdown 代码块标记和解释性文字。
                  3. 必须检查并修复 XML 语法，尤其是以下常见错误：
                     - 错误：<?xmlversion="1.0"encoding="UTF-8"?>
                       正确：<?xml version="1.0" encoding="UTF-8"?>
                     - 错误：<mxfilehost="app.diagrams.net">
                       正确：<mxfile host="app.diagrams.net">
                     - 错误：<diagramid="xxx"name="xxx">
                       正确：<diagram id="xxx" name="xxx">
                     - 错误：<mxCellid="0"/>
                       正确：<mxCell id="0"/>
                     - 错误：<mxGeometryx="10"y="20"width="100"height="40"as="geometry"/>
                       正确：<mxGeometry x="10" y="20" width="100" height="40" as="geometry"/>
                  4. XML 必须以 <mxfile 开头，或 XML 声明后紧跟 <mxfile。
                  5. XML 必须包含 <diagram>、<mxGraphModel>、<root>、id="0" 和 id="1" 的基础 mxCell。
                  6. 所有 XML 属性之间必须有空格，不能出现 mxfilehost、diagramid、mxCellid、mxGeometryx 这类粘连标签。
                  7. XML 属性值中的特殊字符必须正确转义，尤其是 & 必须写成 &amp;。
                  8. 检查连线是否混乱或有严重交叉，并在文本层面尽力优化布局逻辑。
                  9. 最终只输出修复后的原始 Draw.io XML，不要输出 JSON、Markdown、代码块、解释文字或额外字段。
                output-key: reviewed_diagram

              # 4. 最终 JSON 封装智能体
              - name: agent_final_json
                description: 将追问消息或最终 Draw.io XML 严格封装为前端可消费的 JSON。
                instruction: |
                  你是最终输出封装智能体。请根据 {reviewed_diagram} 输出唯一 JSON 对象。

                  如果上游结果是 {"type":"user",...}，必须原样输出该 JSON，不要增加任何解释。

                  否则，将 {reviewed_diagram} 封装为：
                  {"type":"drawio","content":"这里放最终 Draw.io XML 字符串"}

                  严格要求：
                  1. 最终只能输出一个 JSON 对象。
                  2. type 只能是 user 或 drawio。
                  3. content 必须是字符串。
                  4. content 中必须是完整 Draw.io XML，根节点为 <mxfile>，或 XML 声明后紧跟 <mxfile>。
                  5. content 中的 XML 双引号、换行、反斜杠必须按 JSON 字符串规则转义。
                  6. 不允许输出 Markdown、代码块、解释文字或额外字段。
                output-key: final_result

            agent-workflows:
              # 案例；定义一个循环工作流（示例），用于反复优化绘图（需要在 instruction 中支持反馈机制才能生效）
              - type: loop
                name: loop_refinement
                description: 循环优化绘图结果
                max-iterations: 3
                sub-agents:
                  - agent_drawer
                  - agent_reviewer

              # 案例；定义一个并行工作流（示例），可以并行生成多个方案（需要后续有 Agent 进行选择）
              - type: parallel
                name: parallel_generation
                description: 并行生成多个绘图方案
                sub-agents:
                  - agent_drawer
                  - agent_reviewer

              # 对外；定义一个串行工作流，按顺序执行分析、绘图、检查
              - type: sequential
                name: sequential_draw_process
                description: 标准绘图流程：分析 -> 绘图 -> 检查 -> JSON封装
                sub-agents:
                  - agent_analyst
                  - agent_drawer
                  - agent_reviewer
                  - agent_final_json

            runner:
              # 指定入口为串行工作流，这是最稳健的配置
              agent-name: sequential_draw_process
